<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Elite Events - Registrarse</title>

    <link rel="stylesheet" href="./style.css">

</head>

<body>

<header>

    <div class="logo">
           <img src="./img/logo.png" alt="Elite Events">
    </div>

    <nav>

        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18">
                <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-5.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v5.625h4.125c.621 0 1.125-.504 1.125-1.125V9.75" />
            </svg>
            Inicio
        </a>

        <a href="eventos.html">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 9.75h18M4.5 5.25h15a1.5 1.5 0 0 1 1.5 1.5v12.75a1.5 1.5 0 0 1-1.5 1.5h-15a1.5 1.5 0 0 1-1.5-1.5V6.75a1.5 1.5 0 0 1 1.5-1.5Z" />
            </svg>
            Eventos
        </a>

        <a href="reservas.html">
            <i class="icono">🎟</i>
            Mis reservas
        </a>

        <a href="crear-evento.html">
            <i class="icono">＋</i>
            Crear evento
        </a>

    </nav>

</header>


<main>

    <section class="formulario">

        <h1>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="28" height="28">
                <path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v3m3-3h-3m-1.5 8.25a4.5 4.5 0 0 0-9 0m9 0a4.5 4.5 0 0 1-9 0M15 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
            Crear cuenta
        </h1>

        <p>
            Regístrate para descubrir y reservar eventos.
        </p>


        <form id="formRegistro">

            <!-- NOMBRE -->

            <label for="nombreRegistro">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                </svg>
                Nombre
            </label>

            <input
                type="text"
                id="nombreRegistro"
                placeholder="Tu nombre"
                required
            >


            <!-- APELLIDO -->

            <label for="apellidoRegistro">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                </svg>
                Apellido
            </label>

            <input
                type="text"
                id="apellidoRegistro"
                placeholder="Tu apellido"
                required
            >


            <!-- CORREO -->

            <label for="correoRegistro">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25H4.5a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15A2.25 2.25 0 0 0 2.25 6.75m19.5 0-9.75 6.75-9.75-6.75" />
                </svg>
                Correo electrónico
            </label>

            <input
                type="email"
                id="correoRegistro"
                placeholder="correo@gmail.com"
                required
            >


            <!-- CONTRASEÑA -->

            <label for="passwordRegistro">
                Contraseña
            </label>

            <input
                type="password"
                id="passwordRegistro"
                placeholder="Contraseña"
                minlength="6"
                required
            >


            <button
                type="submit"
                class="btn-principal"
            >
                Registrarme
            </button>

        </form>


        <!-- MENSAJE -->

        <p
            id="mensajeRegistro"
            class="centrado"
        ></p>


        <p class="centrado">

            ¿Ya tienes una cuenta?

            <a href="login.html">
                Inicia sesión
            </a>

        </p>

    </section>

</main>


<script src="./script.js"></script>

</body>

</html>
