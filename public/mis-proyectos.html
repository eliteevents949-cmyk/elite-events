<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elite Events - Mis proyectos</title>

    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <!-- ============================= -->
    <!-- ENCABEZADO -->
    <!-- ============================= -->

    <header>

        <!-- LOGO -->
        <div class="logo">
            <img src="./img/logo.png" alt="Elite Events">
        </div>


        <!-- MENÚ -->
        <nav>

            <a href="index.html">
                <i class="icono">⌂</i>
                Inicio
            </a>

            <a href="eventos.html">
                <i class="icono">▣</i>
                Eventos
            </a>

            <a href="mis-proyectos.html" class="activo">
                <i class="icono">📁</i>
                Mis proyectos
            </a>

            <a href="reservas.html">
                <i class="icono">🎟</i>
                Mis reservas
            </a>

            <a href="crear-evento.html">
                <i class="icono">＋</i>
                Crear evento
            </a>

        </nav>


        <!-- CUENTA -->
        <div class="cuenta">

            <a
                href="login.html"
                class="btn-login"
                id="btnLogin"
            >
                <i class="icono">♙</i>
                Iniciar sesión
            </a>


            <a
                href="registro.html"
                class="btn-registro"
                id="btnRegistro"
            >
                <i class="icono">♙</i>
                Registrarse
            </a>


        </div>

    </header>


    <!-- ============================= -->
    <!-- CONTENIDO -->
    <!-- ============================= -->

    <main>

        <section class="categorias">

            <p class="bienvenida">
                MIS PROYECTOS
            </p>

            <h1>
                Eventos que has creado
            </h1>

            <p>
                Aquí puedes consultar los eventos que has organizado
                en Elite Events.
            </p>

        </section>


        <!-- ============================= -->
        <!-- LISTA DE EVENTOS -->
        <!-- ============================= -->

        <section class="eventos">

            <div
                id="listaMisProyectos"
                class="lista-eventos"
            >
                <!-- Los eventos aparecerán aquí -->
            </div>

        </section>

    </main>


    <!-- ============================= -->
    <!-- PIE DE PÁGINA -->
    <!-- ============================= -->

    <footer>

        <h3>
            Elite Events
        </h3>

        <p>
            Descubre. Organiza. Disfruta.
        </p>

        <p>
            © 2026 Elite Events
        </p>

    </footer>


    <script src="./script.js"></script>

</body>

</html>
