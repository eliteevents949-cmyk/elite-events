<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Elite Events - Iniciar sesión</title>

    <link rel="stylesheet" href="./style.css">

</head>

<body>

<header>

    <div class="logo">
        🎉 <span>Elite Events</span>
    </div>

    <nav>

        <a href="index.html">
            Inicio
        </a>

        <a href="eventos.html">
            Eventos
        </a>

        <a href="registro.html">
            Registrarse
        </a>

    </nav>

</header>


<main>

    <section class="formulario">

        <h1>🔐 Iniciar sesión</h1>

        <p>
            Ingresa a tu cuenta de Elite Events.
        </p>


        <form id="formLogin">

            <label for="correoLogin">
                Correo electrónico
            </label>

            <input
                type="email"
                id="correoLogin"
                placeholder="correo@gmail.com"
                required
            >


            <label for="passwordLogin">
                Contraseña
            </label>

            <input
                type="password"
                id="passwordLogin"
                placeholder="Tu contraseña"
                required
            >


            <button
                type="submit"
                class="btn-principal"
            >
                Iniciar sesión
            </button>

        </form>


        <p
            id="mensajeLogin"
            class="centrado"
        ></p>


        <p class="centrado">

            ¿No tienes una cuenta?

            <a href="registro.html">
                Regístrate
            </a>

        </p>

    </section>

</main>


<script src="./script.js"></script>

</body>

</html>
