<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Elite Events - Iniciar sesión</title>

    <link rel="stylesheet" href="./style.css">

</head>

<body>

<header>

    <div class="logo">
        <img src="./img/logo.png" alt="Elite Events">
    </div>

    <nav>

        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke-width="1.5"
                 stroke="currentColor"
                 width="18"
                 height="18">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-5.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v5.625h4.125c.621 0 1.125-.504 1.125-1.125V9.75" />
            </svg>
            Inicio
        </a>

        <a href="eventos.html">
            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke-width="1.5"
                 stroke="currentColor"
                 width="18"
                 height="18">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M6.75 3v2.25M17.25 3v2.25M3 9.75h18M4.5 5.25h15a1.5 1.5 0 0 1 1.5 1.5v12.75a1.5 1.5 0 0 1-1.5 1.5h-15a1.5 1.5 0 0 1-1.5-1.5V6.75a1.5 1.5 0 0 1 1.5-1.5Z" />
            </svg>
            Eventos
        </a>

        <a href="reservas.html">
            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke-width="1.5"
                 stroke="currentColor"
                 width="18"
                 height="18">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M2.25 8.25h19.5M3.75 5.25h16.5A1.5 1.5 0 0 1 21.75 6.75v10.5a1.5 1.5 0 0 1-1.5 1.5H3.75a1.5 1.5 0 0 1-1.5-1.5V6.75a1.5 1.5 0 0 1 1.5-1.5Z" />
            </svg>
            Mis reservas
        </a>

        <a href="crear-evento.html">
            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke-width="1.5"
                 stroke="currentColor"
                 width="18"
                 height="18">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M12 9v6m3-3H9m10.5 0a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" />
            </svg>
            Crear evento
        </a>

    </nav>

</header>


<main>

    <section class="formulario">

        <h1>Iniciar sesión</h1>

        <form id="formLogin">

            <label for="correoLogin">
                <svg xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke-width="1.5"
                     stroke="currentColor"
                     width="18"
                     height="18">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25H4.5a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0-9.75 6-9.75-6" />
                </svg>
                Correo electrónico
            </label>

            <input
                type="email"
                id="correoLogin"
                placeholder="correo@gmail.com"
                required
            >


            <label for="passwordLogin">
                <svg xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke-width="1.5"
                     stroke="currentColor"
                     width="18"
                     height="18">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M16.5 10.5V6.75a4.5 4.5 0 0 0-9 0v3.75m-.75 0h10.5a1.5 1.5 0 0 1 1.5 1.5v7.5a1.5 1.5 0 0 1-1.5 1.5h-12a1.5 1.5 0 0 1-1.5-1.5V12a1.5 1.5 0 0 1 1.5-1.5Z" />
                </svg>
                Contraseña
            </label>

            <div class="campo-password">
                <input
                    type="password"
                    id="passwordLogin"
                    placeholder="Tu contraseña"
                    autocomplete="current-password"
                    required
                >
                <button class="alternar-password" type="button" data-password-target="passwordLogin" aria-label="Mostrar contraseña" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.25 12s3.5-6 9.75-6 9.75 6 9.75 6-3.5 6-9.75 6-9.75-6-9.75-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                </button>
            </div>


            <button
                type="submit"
                class="btn-principal"
            >
                <svg xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke-width="1.5"
                     stroke="currentColor"
                     width="18"
                     height="18">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-3a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 10.5 21h3a2.25 2.25 0 0 0 2.25-2.25V15m3-3H12m0 0 3-3m-3 3 3 3" />
                </svg>
                Iniciar sesión
            </button>


        </form>


        <p
            id="mensajeLogin"
            class="centrado"
        ></p>

        <p class="centrado">
            <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
        </p>


        <p class="centrado">

            ¿No tienes una cuenta?

            <a href="registro.html">
                Regístrate
            </a>

        </p>

    </section>

</main>


<script src="./script.js"></script>

</body>

</html>
