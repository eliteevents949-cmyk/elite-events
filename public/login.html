<form id="formLogin" onsubmit="iniciarSesion(event)">

    <label>Correo electrónico</label>

    <input
        type="email"
        id="correoLogin"
        placeholder="correo@gmail.com"
        required
    >

    <label>Contraseña</label>

    <input
        type="password"
        id="passwordLogin"
        placeholder="Contraseña"
        required
    >

    <button type="submit">
        Iniciar sesión
    </button>

</form>

<script src="./script.js"></script>
