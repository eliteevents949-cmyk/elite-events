<section class="formulario">

    <form id="formEvento">

        <label for="nombreEvento">
            Nombre del evento
        </label>

        <input
            type="text"
            id="nombreEvento"
            placeholder="Ej: Concierto de verano"
            required
        >


        <label for="categoriaEvento">
            Categoría
        </label>

        <select id="categoriaEvento" required>
            <option value="">Selecciona una categoría</option>
            <option value="Música">Música</option>
            <option value="Tecnología">Tecnología</option>
            <option value="Arte">Arte</option>
            <option value="Deportes">Deportes</option>
            <option value="Cultura">Cultura</option>
        </select>


        <label for="descripcionEvento">
            Descripción
        </label>

        <textarea
            id="descripcionEvento"
            placeholder="Describe tu evento"
            required
        ></textarea>


        <label for="fechaEvento">
            Fecha
        </label>

        <input
            type="date"
            id="fechaEvento"
            required
        >


        <label for="horaEvento">
            Hora
        </label>

        <input
            type="time"
            id="horaEvento"
            required
        >


        <label for="lugarEvento">
            Lugar
        </label>

        <input
            type="text"
            id="lugarEvento"
            placeholder="Ej: Medellín"
            required
        >


        <label for="precioEvento">
            Precio de entrada
        </label>

        <input
            type="number"
            id="precioEvento"
            placeholder="Ej: 50000"
            min="0"
            required
        >


        <button
            type="submit"
            class="btn-principal"
        >
            Crear evento
        </button>


        <p
            id="mensajeEvento"
            class="mensaje-evento"
        ></p>

    </form>

</section>
