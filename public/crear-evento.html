<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear evento - Elite Events</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            <img src="./img/logo.png" alt="Elite Events">
        </div>

        <nav>

            <a href="index.html">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="m2.25 12 9.75-9 9.75 9M4.5 10.5v9.75h15V10.5" />
                </svg>
                Inicio
            </a>

            <a href="eventos.html">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M6.75 3v2.25M17.25 3v2.25M3 9.75h18M5.25 5.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25A2.25 2.25 0 0 1 18.75 21H5.25A2.25 2.25 0 0 1 3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25Z" />
                </svg>
                Eventos
            </a>

            <a href="reservas.html">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16.5 6.75h.75A2.25 2.25 0 0 1 19.5 9v6a2.25 2.25 0 0 1-2.25 2.25h-.75M7.5 6.75h-.75A2.25 2.25 0 0 0 4.5 9v6a2.25 2.25 0 0 0 2.25 2.25h.75m0-10.5h9m-9 10.5h9M9 6.75v10.5m6-10.5v10.5" />
                </svg>
                Mis reservas
            </a>

            <a href="crear-evento.html" class="activo">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
                Crear evento
            </a>

        </nav>

    </header>


    <main>

        <section class="formulario">

            <h1>Crear evento</h1>

            <form id="formEvento">

                <label for="nombreEvento">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M19.5 14.25v-8.25A2.25 2.25 0 0 0 17.25 3.75h-6.879a2.25 2.25 0 0 0-1.591.659L5.409 7.78a2.25 2.25 0 0 0-.659 1.591v8.879A2.25 2.25 0 0 0 7 20.5h10.25a2.25 2.25 0 0 0 2.25-2.25v-4Z" />
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 13.5h6M9 16.5h4.5M9 10.5h6" />
                    </svg>
                    Nombre del evento
                </label>

                <input
                    type="text"
                    id="nombreEvento"
                    placeholder="Ej: Concierto de verano"
                    required
                >


                <label for="categoriaEvento">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9.568 3.5H5.25A1.75 1.75 0 0 0 3.5 5.25v4.318a1.75 1.75 0 0 0 .513 1.237l8.882 8.882a1.75 1.75 0 0 0 2.475 0l4.318-4.318a1.75 1.75 0 0 0 0-2.475L10.806 4.013A1.75 1.75 0 0 0 9.568 3.5Z" />
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M7.5 7.5h.008v.008H7.5V7.5Z" />
                    </svg>
                    Categoría
                </label>

                <select id="categoriaEvento" required>

                    <option value="">
                        Selecciona una categoría
                    </option>

                    <option value="Música">
                        Música
                    </option>

                    <option value="Tecnología">
                        Tecnología
                    </option>

                    <option value="Arte">
                        Arte
                    </option>

                    <option value="Deportes">
                        Deportes
                    </option>

                    <option value="Cultura">
                        Cultura
                    </option>

                </select>


                <label for="descripcionEvento">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3.75 6.75h16.5M3.75 12h10.5M3.75 17.25h6" />
                    </svg>
                    Descripción
                </label>

                <textarea
                    id="descripcionEvento"
                    placeholder="Describe tu evento"
                    required
                ></textarea>


                <label for="fechaEvento">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M6.75 3v2.25M17.25 3v2.25M3 9.75h18M5.25 5.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25A2.25 2.25 0 0 1 18.75 21H5.25A2.25 2.25 0 0 1 3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25Z" />
                    </svg>
                    Fecha
                </label>

                <input
                    type="date"
                    id="fechaEvento"
                    required
                >


                <label for="horaEvento">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>
                    Hora
                </label>

                <input
                    type="time"
                    id="horaEvento"
                    required
                >


                <label for="lugarEvento">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M19.5 10.5c0 7.142-7.5 10.5-7.5 10.5S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
                    </svg>
                    Lugar
                </label>

                <input
                    type="text"
                    id="lugarEvento"
                    placeholder="Ej: Medellín"
                    required
                >


                <label for="precioEvento">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 6v12m4.5-9.75c0-1.243-2.015-2.25-4.5-2.25S7.5 6.007 7.5 7.25 9.515 9.5 12 9.5s4.5 1.007 4.5 2.25S14.485 14 12 14s-4.5-1.007-4.5-2.25" />
                    </svg>
                    Precio de entrada
                </label>

                <input
                    type="number"
                    id="precioEvento"
                    placeholder="Ej: 50000"
                    min="0"
                    required
                >


                <label for="boletasEvento">
                    Boletas disponibles
                </label>

                <input
                    type="number"
                    id="boletasEvento"
                    placeholder="Ej: 100"
                    min="1"
                    step="1"
                    required
                >


                <!-- IMAGEN DEL EVENTO -->

                <label for="imagenEvento">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="m2.25 15.75 4.5-4.5 3 3 3.75-3.75 6.75 6.75M3.75 21h16.5A1.75 1.75 0 0 0 22 19.25V6.75A1.75 1.75 0 0 0 20.25 5H3.75A1.75 1.75 0 0 0 2 6.75v12.5A1.75 1.75 0 0 0 3.75 21Z" />
                    </svg>
                    Imagen del evento
                </label>

                <input
                    type="file"
                    id="imagenEvento"
                    accept="image/png, image/jpeg, image/webp"
                >


                <button
                    type="submit"
                    class="btn-principal"
                >
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="m9 12.75 2.25 2.25L15 11.25M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>
                    Crear evento
                </button>


                <p
                    id="mensajeEvento"
                    class="mensaje-evento"
                ></p>

            </form>

        </section>

    </main>


    <footer>

        <h3>Elite Events</h3>

        <p>
            Organiza, descubre y disfruta de tus eventos.
        </p>

        <p>
            © 2026 Elite Events
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
