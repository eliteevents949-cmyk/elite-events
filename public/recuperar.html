<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - Elite Events</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="./img/logo.png" alt="Elite Events">
        </div>
        <nav></nav>
        <div class="cuenta"></div>
    </header>

    <main>
        <section class="formulario">
            <h1 id="tituloRecuperacion">Recuperar contraseña</h1>
            <p id="descripcionRecuperacion" class="centrado">Escribe el correo asociado a tu cuenta y te enviaremos un enlace para crear una contraseña nueva.</p>

            <form id="formRecuperar" class="form-recuperacion">
                <label for="correoRecuperacion">Correo electrónico</label>
                <input id="correoRecuperacion" name="correo" type="email" autocomplete="email" placeholder="correo@gmail.com" required>
                <button class="btn-principal" type="submit">Enviar enlace</button>
            </form>

            <form id="formRestablecer" class="form-recuperacion" hidden>
                <label for="nuevaPassword">Nueva contraseña</label>
                <div class="campo-password">
                    <input id="nuevaPassword" name="password" type="password" minlength="6" autocomplete="new-password" required>
                    <button class="alternar-password" type="button" data-password-target="nuevaPassword" aria-label="Mostrar contraseña" aria-pressed="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.25 12s3.5-6 9.75-6 9.75 6 9.75 6-3.5 6-9.75 6-9.75-6-9.75-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                    </button>
                </div>

                <label for="confirmarPassword">Confirmar contraseña</label>
                <div class="campo-password">
                    <input id="confirmarPassword" name="confirmarPassword" type="password" minlength="6" autocomplete="new-password" required>
                    <button class="alternar-password" type="button" data-password-target="confirmarPassword" aria-label="Mostrar contraseña" aria-pressed="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.25 12s3.5-6 9.75-6 9.75 6 9.75 6-3.5 6-9.75 6-9.75-6-9.75-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                    </button>
                </div>
                <button class="btn-principal" type="submit">Guardar contraseña</button>
            </form>

            <p id="mensajeRecuperacion" class="centrado" role="status" aria-live="polite"></p>
            <p class="centrado"><a href="login.html">Volver a iniciar sesión</a></p>
        </section>
    </main>

    <script src="./script.js"></script>
</body>
</html>
